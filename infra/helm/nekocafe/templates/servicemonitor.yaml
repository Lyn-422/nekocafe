{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nekocafe-servicemonitor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nekocafe
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nekocafe
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
