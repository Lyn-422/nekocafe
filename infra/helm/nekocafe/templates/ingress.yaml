{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nekocafe-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nekocafe
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: /api/v1/member
            pathType: Prefix
            backend:
              service:
                name: member-service
                port:
                  number: 8080
          - path: /api/v1/reservation
            pathType: Prefix
            backend:
              service:
                name: reservation-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: member-service
                port:
                  number: 8080
          {{- end }}
    {{- end }}
{{- end }}
