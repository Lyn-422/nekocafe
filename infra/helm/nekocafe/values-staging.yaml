# NekoCafé - staging 环境配置

global:
  environment: staging

member:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    APP_ENV: "staging"
    LOG_LEVEL: "INFO"

reservation:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    APP_ENV: "staging"
    LOG_LEVEL: "INFO"

mysql:
  persistence:
    size: 20Gi

redis:
  persistence:
    size: 5Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

pdb:
  enabled: true
  minAvailable: 1

canary:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: api-staging.nekocafe.com

otel:
  enabled: true
  endpoint: "http://otel-collector.nekocafe-staging:4317"
  samplingRate: 0.5

serviceMonitor:
  enabled: true
