# Prometheus 配置 - NekoCafé

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: nekocafe
    environment: dev

# Alert rules
rule_files:
  - "/etc/prometheus/alerts.yml"

# Scrape configs
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "member-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["member-service:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):\\d+"
        replacement: "${1}"

  - job_name: "reservation-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["reservation-service:8081"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):\\d+"
        replacement: "${1}"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
